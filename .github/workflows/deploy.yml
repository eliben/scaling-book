name: Deploy to GitHub Pages

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      branch_path: ${{ steps.path.outputs.branch_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Jupyter
        run: pip install jupyter

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.5"
          bundler-cache: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compute branch path
        id: path
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME}"
          slug="$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s#^-+##; s#-+$##')"
          if [[ -z "$slug" ]]; then
            slug="branch"
          fi
          echo "branch_path=$slug" >> "$GITHUB_OUTPUT"
          echo "baseurl=/scaling-book/$slug" >> "$GITHUB_OUTPUT"

      - name: Build branch site
        run: |
          rm -rf _site
          mkdir -p _site
          bundle exec jekyll build \
            --destination "_site/${{ steps.path.outputs.branch_path }}" \
            --url "https://eliben.github.io" \
            --baseurl "${{ steps.path.outputs.baseurl }}"

      - name: Add root redirect
        run: |
          cat > _site/index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=${{ steps.path.outputs.branch_path }}/">
          <link rel="canonical" href="${{ steps.path.outputs.branch_path }}/">
          <title>Redirecting...</title>
          <a href="${{ steps.path.outputs.branch_path }}/">Redirecting to ${{ steps.path.outputs.branch_path }}/</a>
          EOF
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}${{ needs.build.outputs.branch_path }}/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
